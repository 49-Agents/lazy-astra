[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-critic-luna-actor"
version = "0.1.0"
description = "Standalone ACLA Manager–Worker coordination loop"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
acla = "acla.cli:main"

[project.urls]
Repository = "https://github.com/49-Agents/lazy-astra"

[tool.setuptools]
py-modules = ["acla_cli"]

[tool.setuptools.packages.find]
include = ["acla*"]
