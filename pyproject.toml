[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-critic-luna-actor"
version = "0.1.0"
description = "Standalone Astra critic and Luna actor coordination loop"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
acla = "acla.cli:main"

[tool.setuptools.packages.find]
include = ["acla*"]
